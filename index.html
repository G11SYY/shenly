<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古诗拼字 · 两关岳阳楼</title>
    <script src="poems.js"></script>
    <script src="decompose.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'KaiTi', '华文楷体', '宋体', 'Microsoft YaHei', serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2e3b4e;
            padding: 0;
            margin: 0;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: #f3efe6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            transition: opacity 0.25s ease;
            background: #f3efe6;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* ================= 主界面 ================= */
        #main-screen {
            justify-content: center;
            align-items: center;
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e6dfd1;
        }

        .main-button {
            background: rgba(184, 166, 139, 0.95);
            border: 3px solid #fef9e8;
            border-radius: 80px;
            padding: 3vw 10vw;
            font-size: clamp(24px, 8vw, 48px);
            font-weight: bold;
            color: #fef9e8;
            text-shadow: 3px 3px 0 #7a6a58;
            box-shadow: 0 12px 0 #7a6a58, 0 15px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.08s linear;
            font-family: 'KaiTi', '华文楷体', serif;
            transform: translateY(-4px);
        }

        .main-button:active {
            box-shadow: 0 6px 0 #7a6a58, 0 10px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(6px);
        }

        /* ================= 选关界面 ================= */
        #select-screen {
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e8e0d3;
            align-items: center;
            justify-content: center;
        }

        #select-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 250, 240, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        .back-btn {
            position: absolute;
            top: 2vh;
            left: 4vw;
            background: rgba(184, 166, 139, 0.95);
            border: none;
            padding: 1.5vh 4vw;
            border-radius: 40px;
            font-size: clamp(14px, 4vw, 20px);
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            z-index: 10;
        }

        .back-btn:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(2px);
        }

        .level-scroll {
            position: absolute;
            top: 12vh;                    /* 从返回按钮下面开始 */
            left: 0;
            right: 0;
            bottom: 8vh;                  /* 到底部蓝线为止 */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 10px 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .level-scroll::-webkit-scrollbar {
            display: none;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 500px;
        }

        .level-btn {
            width: clamp(50px, 15vw, 70px);
            height: clamp(50px, 15vw, 70px);
            border-radius: 18px;
            background: #cdba9f;
            border: none;
            font-size: clamp(20px, 6vw, 28px);
            font-weight: bold;
            color: #3a2f23;
            box-shadow: 0 5px 0 #8f7a63, 0 6px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
        }

        .level-btn:active {
            box-shadow: 0 2px 0 #8f7a63;
            transform: translateY(3px);
        }

                /* 已通关的关卡按钮 */
        .level-btn.completed {
            background: #d4b48a;
            border: 2px solid #b8860b;
            flex-direction: column;
            padding: 4px;
            line-height: 1;
        }

        .level-btn .level-num {
            font-size: clamp(16px, 5vw, 22px);
            font-weight: bold;
            color: #3a2f23;
            margin-bottom: 2px;
        }

        .level-btn .level-stars {
            font-size: clamp(10px, 3vw, 14px);
            color: #d4a017;
            letter-spacing: 1px;
        }

        /* 通关页面的星星显示 */
        .completed-stars {
            font-size: clamp(48px, 15vw, 80px);
            color: #d4a017;
            text-align: center;
            letter-spacing: 8px;
            margin-top: 20vh;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* ================= 关卡界面 ================= */
        #play-screen {
            padding: 6vh 16px 9vh 16px;   /* 底部留 9vh 给底部栏 */
            display: flex;
            flex-direction: column;
            background: #f3efe6;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d9cdb9;
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 6px rgba(88, 68, 48, 0.2), 0 4px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .btn-restart, .btn-exit {
            background: #b8a68b;
            border: none;
            padding: 2vw 5vw;
            border-radius: 40px;
            font-size: clamp(14px, 4vw, 20px);
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            min-width: 20vw;
        }

        .btn-restart:active, .btn-exit:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(3px);
        }

        .timer {
            font-size: clamp(18px, 6vw, 32px);
            font-weight: bold;
            color: #3a2e24;
            background: #f0e8da;
            padding: 1vw 5vw;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #baa78e, inset 0 4px 8px rgba(0,0,0,0.1);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #d9cdb9;
            font-variant-numeric: tabular-nums;
            min-width: 26vw;
            text-align: center;
            display: inline-block;
        }

        /* ===== 古诗展示：屏幕 1/3 ===== */
        .poem-area {
            flex: 1.2;                    /* 从 1 改成 1.2 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fffcf2;
            border-radius: 28px;
            padding: 1.5vh 1vw;
            margin-bottom: 1.5vw;
            box-shadow: inset 0 0 0 3px #d6c6b2, 0 8px 12px rgba(0, 0, 0, 0.1);
            min-height: 0;
            overflow: hidden;
        }

        .poem-title {
            font-size: clamp(13px, 4vw, 19px);
            font-weight: bold;
            color: #8a6a4a;
            text-align: center;
            margin-bottom: 1px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #e6d6c0;
            flex-shrink: 0;
        }

        .poem-line {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0px 0.2vw;
            font-size: clamp(13px, 4vw, 20px);
            line-height: 1.2;
            color: #3f3226;
            transition: color 0.3s, text-shadow 0.3s;
            font-weight: 600;
            letter-spacing: 0;
        }

        .poem-char {
            display: inline-block;
            color: #3f3226;
            font-size: clamp(13px, 4vw, 20px);
            min-width: clamp(15px, 4.4vw, 22px);
            text-align: center;
            padding: 0;
            transition: color 0.35s, text-shadow 0.35s;
        }

        .poem-char.lit {
            color: #ad6b3e;
            font-weight: 900;
            text-shadow: 0 0 6px #f7d9a0, 1px 1px 0 #fff3e0;
        }

        .poem-char.punctuation {
            opacity: 0.7;
            min-width: 10px;
        }

        /* 拆字部件区：屏幕 2/3，底部预留按钮空间 */
        .pieces-area {
            flex: 2;
            position: relative;
            background: #e6daca;
            border-radius: 28px;
            padding: 1vw 1vw 8vh 1vw;
            margin-bottom: 0;
            box-shadow: inset 0 0 0 3px #cbb99f, inset 0 6px 12px rgba(90, 70, 50, 0.2);
            overflow: hidden;
            min-height: 0;
        }

        .piece-layer {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            display: flex;
            justify-content: center;    /* 网格水平居中 */
            align-items: center;        /* 网格垂直居中 */
            padding: 0;
            border-radius: 18px;
            transition: opacity 0.35s, filter 0.35s;
            overflow: hidden;
        }

        .piece-grid {
            display: grid;
            gap: 0;
            max-width: 100%;
            max-height: 100%;
        }

        .piece-layer.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        .piece-layer.completed {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        .piece-layer.locked {
            opacity: 0.25;
            z-index: 2;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        .piece {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fcf7ed;
            border-radius: 6px;
            padding: 0;
            box-shadow: 0 2px 0 #a58d73;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: clamp(14px, 4.2vw, 19px);
            color: #3f3226;
            font-weight: 600;
            border: 1px solid #cdba9f;
            margin: 0;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        .piece.hidden {
            visibility: hidden;    /* 隐藏但保留位置 */
            pointer-events: none;
        }

        .piece:active {
            box-shadow: 0 1px 0 #a58d73;
            transform: translateY(2px);
        }

        .piece.selected {
            background: #ffd98a;
            border-color: #b8860b;
            box-shadow: 0 3px 0 #a67c00, 0 0 0 3px rgba(200, 150, 50, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        /* 提示高亮 */
        .piece.hint-highlight {
            background: #ffe4a0;
            border-color: #d4a017;
            box-shadow: 0 3px 0 #a67c00, 0 0 0 4px rgba(255, 200, 100, 0.6);
            animation: hint-pulse 0.8s ease-in-out infinite alternate;
        }

        @keyframes hint-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .piece .part {
            display: inline-block;
            font-size: clamp(15px, 4.5vw, 20px);
            line-height: 1;
        }

        .fly-char {
            position: fixed;
            font-size: 42px;
            font-weight: bold;
            color: #ad6b3e;
            text-shadow: 0 0 12px #f7d9a0;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 1;
            font-family: 'KaiTi', serif;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 30, 20, 0.5);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #fef9ed;
            padding: 6vw 10vw;
            border-radius: 60px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 5px #dac09c;
            text-align: center;
            border: 2px solid #b8a68b;
        }

        .modal-box h2 {
            font-size: clamp(28px, 8vw, 48px);
            color: #6f523b;
            margin-bottom: 4vh;
            text-shadow: 2px 2px 0 #e6d6c0;
            letter-spacing: 4px;
        }

        .modal-btn {
            background: #b8a68b;
            border: none;
            padding: 2.5vh 8vw;
            font-size: clamp(20px, 6vw, 32px);
            border-radius: 40px;
            color: #2c241c;
            font-weight: bold;
            box-shadow: 0 8px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-3px);
        }

        .modal-btn:active {
            box-shadow: 0 3px 0 #7a6a58;
            transform: translateY(5px);
        }

        .hidden-modal {
            display: none;
        }

        .hint {
            font-size: clamp(12px, 3.2vw, 15px);
            color: #8a7a66;
            text-align: left;
            flex: 1;
            line-height: 1.3;
            padding-right: 8px;
            margin-top: 2vh;              /* 往下移 */
        }

        .action-btn {
            background: #b8a68b;
            border: none;
            padding: 1.2vh 4vw;
            border-radius: 40px;
            font-size: clamp(13px, 3.6vw, 17px);
            font-weight: bold;
            color: #d4a017;              /* 金色文字 */
            text-shadow: 1px 1px 0 #7a6a58;
            box-shadow: 0 4px 0 #7a6a58;
            cursor: pointer;
            font-family: 'KaiTi', serif;
            flex-shrink: 0;
        }

        .action-btn:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(2px);
        }

        .bottom-buttons {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 6px;
            height: 8vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 0 4px;
        }
        .bottom-buttons .action-btn {
            pointer-events: auto;
        }

    </style>
</head>
<body>
<div id="game-container">
    <div id="main-screen" class="screen">
        <button class="main-button" id="startBtn">开始</button>
    </div>

    <div id="select-screen" class="screen hidden">
        <button class="back-btn" id="backToMainBtn">← 返回</button>
        <div class="level-scroll">
            <div class="level-buttons" id="levelButtons"></div>
        </div>
    </div>

    <div id="play-screen" class="screen hidden">
        <div class="top-bar">
            <button class="btn-restart" id="restartBtn">重开</button>
            <div class="timer" id="timerDisplay">0:00</div>
            <button class="btn-exit" id="exitBtn">退出</button>
        </div>
        <div class="poem-area" id="poemArea"></div>
        <div class="pieces-area" id="piecesArea"></div>
        <div class="bottom-buttons">
            <div class="hint">点击部件加入候选池，系统自动匹配能拼出的字</div>
            <button class="action-btn" id="hintBtn">提示</button>
        </div>
    </div>

    <div id="winModal" class="modal-overlay hidden-modal">
        <div class="modal-box">
            <h2>🎉 通关 🎉</h2>
            <button class="modal-btn" id="nextLevelBtn">下一关</button>
        </div>
    </div>
</div>

<script>
      
      
      function getCharParts(ch) {
            if (CHAR_DECOMPOSE[ch]) return CHAR_DECOMPOSE[ch];
            return [ch];
        }

        // ================= 状态 =================
        let currentLevel = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let currentPoemChars = [];
        let currentLayer = 0;
        let totalLayers = 3;
        let layerUnsolved = [];
        let layerPieceContainers = [];
        let charPieceEls = {};
        let selectedPieces = [];
        let piecePositions = {};   // 每个部件的固定格子位置



                // ================= 通关记录 =================
        // 从 localStorage 读取，格式：{ 0: 3, 1: 2, 2: 1, ... }  键是关卡索引，值是星级
        let levelStars = JSON.parse(localStorage.getItem('levelStars') || '{}');

        // 保存通关记录
        function saveLevelStars() {
            localStorage.setItem('levelStars', JSON.stringify(levelStars));
        }

        // 计算星级：10 分钟内 3 星，10-15 分钟 2 星，超过 15 分钟 1 星
        function calcStars(seconds) {
            if (seconds <= 600) return 3;        // ≤ 10 分钟
            if (seconds <= 900) return 2;        // 10-15 分钟
            return 1;                            // > 15 分钟
        }

                // ================= 关卡进度 =================
        function saveProgress() {
            const progress = {
                level: currentLevel,
                currentLayer: currentLayer,
                litChars: currentPoemChars.map(c => c.lit),
                layerUnsolved: layerUnsolved.map(set => Array.from(set)),
                piecePositions: piecePositions,
                secondsElapsed: secondsElapsed,
                totalLayers: totalLayers
            };
            localStorage.setItem('progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const str = localStorage.getItem('progress');
            if (!str) return null;
            try {
                return JSON.parse(str);
            } catch (e) {
                return null;
            }
        }

        function clearProgress() {
            localStorage.removeItem('progress');
        }

        // 自动保存：页面关闭、切后台、刷新时，保存进度
        window.addEventListener('beforeunload', () => {
            if (!levelStars[currentLevel] && currentPoemChars.length > 0) {
                saveProgress();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !levelStars[currentLevel] && currentPoemChars.length > 0) {
                saveProgress();
            }
        });


        // DOM
        const mainScreen = document.getElementById('main-screen');
        const selectScreen = document.getElementById('select-screen');
        const playScreen = document.getElementById('play-screen');
        const levelButtons = document.getElementById('levelButtons');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const exitBtn = document.getElementById('exitBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const poemArea = document.getElementById('poemArea');
        const piecesArea = document.getElementById('piecesArea');
        const winModal = document.getElementById('winModal');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        // ================= 计时器 =================
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function startTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerDisplay.textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
        }

        function showScreen(screen) {
            [mainScreen, selectScreen, playScreen].forEach(s => s.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        // ================= 选关 =================
        function buildLevelButtons() {
            levelButtons.innerHTML = '';
            POEMS.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.dataset.level = idx;

                // 如果这关已通关，显示星星
                if (levelStars[idx]) {
                    btn.classList.add('completed');
                    const stars = levelStars[idx];
                    btn.innerHTML = `
                        <div class="level-num">${idx + 1}</div>
                        <div class="level-stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
                    `;
                } else {
                    btn.textContent = idx + 1;
                }

                btn.addEventListener('click', () => {
                    currentLevel = idx;
                    enterLevel(currentLevel);
                });
                levelButtons.appendChild(btn);
            });
        }

        // ================= 进入关卡 =================
        function enterLevel(levelIndex) {
            stopTimer();
            resetTimer();
            winModal.classList.add('hidden-modal');
            showScreen(playScreen);

            const poem = POEMS[levelIndex];
            currentLevel = levelIndex;
            currentLayer = 0;
            selectedPieces = [];

            // 构建当前关的字
            currentPoemChars = [];
            poem.lines.forEach((line, lineIdx) => {
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if ('，。？！、；：'.includes(char)) continue;
                    currentPoemChars.push({
                        char: char,
                        lit: false,
                        lineIndex: lineIdx,
                        charIndex: i,
                        globalIndex: currentPoemChars.length
                    });
                }
            });

            // 检查是否有当前关的进度
            const progress = loadProgress();

            // 如果这关已通关，只显示古诗（全亮），不显示拆字
            if (levelStars[levelIndex]) {
                renderPoem(poem.lines);
                currentPoemChars.forEach((_, idx) => {
                    const span = document.getElementById(`poem-char-${idx}`);
                    if (span) span.classList.add('lit');
                });
                piecesArea.innerHTML = '';
                const stars = levelStars[levelIndex];
                const starDiv = document.createElement('div');
                starDiv.className = 'completed-stars';
                starDiv.innerHTML = `${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}`;
                piecesArea.appendChild(starDiv);
                document.querySelector('.bottom-buttons').style.display = 'none';
                return;
            }

            // 如果有当前关的进度，恢复
            if (progress && progress.level === levelIndex) {
                currentLayer = progress.currentLayer;
                totalLayers = progress.totalLayers;
                piecePositions = progress.piecePositions;

                progress.litChars.forEach((lit, idx) => {
                    if (lit) currentPoemChars[idx].lit = true;
                });

                layerUnsolved = progress.layerUnsolved.map(arr => new Set(arr));

                renderPoem(poem.lines);
                currentPoemChars.forEach((c, idx) => {
                    if (c.lit) {
                        const span = document.getElementById(`poem-char-${idx}`);
                        if (span) span.classList.add('lit');
                    }
                });

                document.querySelector('.bottom-buttons').style.display = 'flex';
                charPieceEls = {};
                currentPoemChars.forEach((_, idx) => {
                    charPieceEls[idx] = [];
                });
                renderAllLayers(poem.lines);
                updateLayerStates();

                // 恢复计时器
                secondsElapsed = progress.secondsElapsed || 0;
                timerDisplay.textContent = formatTime(secondsElapsed);
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    timerDisplay.textContent = formatTime(secondsElapsed);
                }, 1000);

                return;
            }

            // 没有进度，新开一局
            document.querySelector('.bottom-buttons').style.display = 'flex';

            charPieceEls = {};
            currentPoemChars.forEach((_, idx) => {
                charPieceEls[idx] = [];
            });

            const allIndices = currentPoemChars.map((_, idx) => idx);
            shuffleArray(allIndices);

            layerUnsolved = [[]];
            let currentLayerParts = 0;

            allIndices.forEach(idx => {
                const parts = getCharParts(currentPoemChars[idx].char).length;
                if (currentLayerParts + parts > 72 && layerUnsolved[layerUnsolved.length - 1].length > 0) {
                    layerUnsolved.push([]);
                    currentLayerParts = 0;
                }
                layerUnsolved[layerUnsolved.length - 1].push(idx);
                currentLayerParts += parts;
            });

            layerUnsolved = layerUnsolved.map(arr => new Set(arr));
            totalLayers = layerUnsolved.length;

            renderPoem(poem.lines);
            renderAllLayers(poem.lines);
            updateLayerStates();
            startTimer();
        }

        function renderPoem(lines) {
            poemArea.innerHTML = '';
            const titleDiv = document.createElement('div');
            titleDiv.className = 'poem-title';
            titleDiv.textContent = POEMS[currentLevel].title || '';
            poemArea.appendChild(titleDiv);

            let globalIdx = 0;
            lines.forEach((line) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'poem-line';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if ('，。？！、；：'.includes(char)) {
                        const span = document.createElement('span');
                        span.className = 'poem-char punctuation';
                        span.textContent = char;
                        lineDiv.appendChild(span);
                        continue;
                    }
                    const span = document.createElement('span');
                    span.className = 'poem-char';
                    span.textContent = char;
                    span.dataset.globalIndex = globalIdx;
                    span.id = `poem-char-${globalIdx}`;
                    lineDiv.appendChild(span);
                    globalIdx++;
                }
                poemArea.appendChild(lineDiv);
            });
        }

        function renderAllLayers(lines) {
            piecesArea.innerHTML = '';
            layerPieceContainers = [];

            for (let layer = 0; layer < totalLayers; layer++) {
                const layerDiv = document.createElement('div');
                layerDiv.className = 'piece-layer';
                layerDiv.dataset.layerIndex = layer;

                const indices = Array.from(layerUnsolved[layer]);
                shuffleArray(indices);

                // 1. 先把这一层所有部件收集到一个数组里
                const allParts = [];
                indices.forEach(charIdx => {
                    const charObj = currentPoemChars[charIdx];
                    const ch = charObj.char;
                    const parts = getCharParts(ch);

                    parts.forEach((partStr, partIndex) => {
                        allParts.push({
                            charIdx: charIdx,
                            char: ch,
                            partStr: partStr,
                            partIndex: partIndex,
                            layer: layer
                        });
                    });
                });

                // 2. 打乱所有部件的顺序
                shuffleArray(allParts);

                // 3. 计算网格行列数
                const totalParts = allParts.length;
                let cols, rows;
                const ratio = 8 / 9;
                let bestDiff = Infinity;
                for (let c = 1; c <= totalParts; c++) {
                    const r = Math.ceil(totalParts / c);
                    const diff = Math.abs(c / r - ratio);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        cols = c;
                        rows = r;
                    }
                }

                // 4. 创建网格容器
                const gridDiv = document.createElement('div');
                gridDiv.className = 'piece-grid';
                gridDiv.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                gridDiv.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

                const layerRect = piecesArea.getBoundingClientRect();
                const maxW = layerRect.width - 20;
                const maxH = layerRect.height - 20;
                const cellW = maxW / cols;
                const cellH = maxH / rows;
                const cellSize = Math.min(cellW, cellH);

                gridDiv.style.width = `${cols * cellSize}px`;
                gridDiv.style.height = `${rows * cellSize}px`;

                // 5. 按打乱后的顺序生成部件
                allParts.forEach(partObj => {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = 'piece';
                    pieceEl.dataset.char = partObj.char;
                    pieceEl.dataset.charIndex = partObj.charIdx;
                    pieceEl.dataset.partIndex = partObj.partIndex;
                    pieceEl.dataset.layer = layer;

                    const span = document.createElement('span');
                    span.className = 'part';
                    span.textContent = partObj.partStr;
                    pieceEl.appendChild(span);

                    pieceEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handlePartClick(pieceEl, partObj.charIdx, layer);
                    });

                    gridDiv.appendChild(pieceEl);
                    charPieceEls[partObj.charIdx].push(pieceEl);
                });

                layerDiv.appendChild(gridDiv);
                piecesArea.appendChild(layerDiv);
                layerPieceContainers.push(layerDiv);
            }
        }


        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function updateLayerStates() {
            layerPieceContainers.forEach((container, layer) => {
                container.classList.remove('active', 'locked', 'completed');
                if (layer < currentLayer) {
                    container.classList.add('completed');
                } else if (layer === currentLayer) {
                    container.classList.add('active');
                } else {
                    container.classList.add('locked');
                }
            });
        }

        // ================= 点击部件 =================
        function handlePartClick(pieceEl, charIdx, layer) {
            if (layer !== currentLayer) return;
            if (currentPoemChars[charIdx].lit) return;
            if (layerUnsolved[layer].size === 0) return;
            if (pieceEl.classList.contains('hidden')) return;   // 隐藏的格子不可点

            if (pieceEl.classList.contains('selected')) {
                pieceEl.classList.remove('selected');
                const idx = selectedPieces.indexOf(pieceEl);
                if (idx > -1) selectedPieces.splice(idx, 1);
                return;
            }

            pieceEl.classList.add('selected');
            selectedPieces.push(pieceEl);
            tryMatchSelected();
        }

        // ================= 候选池匹配 =================
        function tryMatchSelected() {
            const selectedChars = selectedPieces.map(el => el.querySelector('.part').textContent);

            for (let charIdx of layerUnsolved[currentLayer]) {
                const ch = currentPoemChars[charIdx].char;
                const parts = getCharParts(ch);

                if (parts.length === selectedChars.length &&
                    parts.every(p => selectedChars.includes(p)) &&
                    selectedChars.every(p => parts.includes(p))) {
                    completeChar(charIdx, currentLayer);
                    selectedPieces = [];
                    return;
                }
            }

            if (!canMatchAnyPrefix(selectedChars)) {
                selectedPieces.forEach(el => el.classList.remove('selected'));
                selectedPieces = [];
            }
        }

        function canMatchAnyPrefix(selectedChars) {
            for (let charIdx of layerUnsolved[currentLayer]) {
                const ch = currentPoemChars[charIdx].char;
                const parts = getCharParts(ch);
                if (selectedChars.length <= parts.length &&
                    selectedChars.every(p => parts.includes(p))) {
                    return true;
                }
            }
            return false;
        }


        // ================= 完成一个字 =================
        function completeChar(charIdx, layer) {
            const char = currentPoemChars[charIdx].char;
            const targetSpan = document.getElementById(`poem-char-${charIdx}`);
            if (!targetSpan) return;

            const allPieces = charPieceEls[charIdx] || [];
            if (allPieces.length === 0) return;

            const firstPiece = allPieces[0];
            const pieceRect = firstPiece.getBoundingClientRect();
            const targetRect = targetSpan.getBoundingClientRect();

            const flyEl = document.createElement('div');
            flyEl.className = 'fly-char';
            flyEl.textContent = char;
            flyEl.style.left = pieceRect.left + pieceRect.width / 2 - 20 + 'px';
            flyEl.style.top = pieceRect.top + pieceRect.height / 2 - 20 + 'px';
            document.body.appendChild(flyEl);

            requestAnimationFrame(() => {
                flyEl.style.left = targetRect.left + targetRect.width / 2 - 20 + 'px';
                flyEl.style.top = targetRect.top + targetRect.height / 2 - 20 + 'px';
                flyEl.style.opacity = '0.2';
                flyEl.style.transform = 'scale(0.8)';
            });

            setTimeout(() => {
                flyEl.remove();

                currentPoemChars[charIdx].lit = true;
                layerUnsolved[layer].delete(charIdx);
                if (targetSpan) targetSpan.classList.add('lit');

                allPieces.forEach(el => {
                    el.classList.add('hidden');
                    el.classList.remove('selected');
                });

                selectedPieces.forEach(el => {
                    el.classList.remove('selected');
                });
                selectedPieces = [];

                document.querySelectorAll('.piece.selected').forEach(el => {
                    el.classList.remove('selected');
                });

                if (layerUnsolved[layer].size === 0) {
                    if (layer === totalLayers - 1) {
                        stopTimer();
                        const stars = calcStars(secondsElapsed);
                        levelStars[currentLevel] = stars;
                        saveLevelStars();
                        clearProgress();
                        winModal.classList.remove('hidden-modal');
                    } else {
                        currentLayer++;
                        updateLayerStates();
                        saveProgress();
                    }
                } else {
                    saveProgress();
                }
            }, 450);

        }

        // ================= 控制 =================
        function exitToSelect() {
            stopTimer();
            resetTimer();
            // 手动点「退出」：清除进度，不保存
            clearProgress();
            winModal.classList.add('hidden-modal');
            showScreen(selectScreen);
        }

        function restartLevel() {
            clearProgress();
            enterLevel(currentLevel);
        }

        function goToNextLevel() {
            winModal.classList.add('hidden-modal');
            let next = currentLevel + 1;
            if (next >= POEMS.length) next = 0;
            currentLevel = next;
            enterLevel(currentLevel);
        }

                // ================= 提示功能 =================
        function showHint() {
            // 当前层没有未拼的字，忽略
            if (layerUnsolved[currentLayer].size === 0) return;

            // 1. 找一个当前层里「所有部件都还在」的字
            //    部件的判断：这个字的所有部件元素都还没被隐藏（没被拼掉）
            for (let charIdx of layerUnsolved[currentLayer]) {
                const ch = currentPoemChars[charIdx].char;
                const parts = getCharParts(ch);
                const pieceEls = charPieceEls[charIdx] || [];

                // 过滤掉已隐藏的格子
                const availablePieces = pieceEls.filter(el => !el.classList.contains('hidden'));

                // 如果这个字的所有部件都还在
                if (availablePieces.length === parts.length) {
                    // 2. 高亮这些部件
                    // 先清空之前的选中状态
                    selectedPieces.forEach(el => el.classList.remove('selected'));
                    selectedPieces = [];

                    // 给这些部件加高亮（但不加入 selectedPieces，让玩家自己点）
                    availablePieces.forEach(el => {
                        el.classList.add('hint-highlight');
                    });

                    // 3. 3 秒后自动取消高亮
                    setTimeout(() => {
                        availablePieces.forEach(el => {
                            el.classList.remove('hint-highlight');
                        });
                    }, 3000);

                    return;
                }
            }
        }

        // ================= 初始化 =================
        function init() {
            buildLevelButtons();
            startBtn.addEventListener('click', () => showScreen(selectScreen));
            document.getElementById('backToMainBtn').addEventListener('click', () => {
                showScreen(mainScreen);
            });
            restartBtn.addEventListener('click', restartLevel);
            exitBtn.addEventListener('click', exitToSelect);
            nextLevelBtn.addEventListener('click', goToNextLevel);
            document.getElementById('hintBtn').addEventListener('click', showHint);
            showScreen(mainScreen);
        }

        init();

</script>

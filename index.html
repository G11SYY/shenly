<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古诗拼字 · 两关岳阳楼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'KaiTi', '华文楷体', '宋体', 'Microsoft YaHei', serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2e3b4e;
            padding: 0;
            margin: 0;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: #f3efe6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            transition: opacity 0.25s ease;
            background: #f3efe6;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* ================= 主界面 ================= */
        #main-screen {
            justify-content: center;
            align-items: center;
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e6dfd1;
        }

        .main-button {
            background: rgba(184, 166, 139, 0.95);
            border: 3px solid #fef9e8;
            border-radius: 80px;
            padding: 3vw 10vw;
            font-size: clamp(24px, 8vw, 48px);
            font-weight: bold;
            color: #fef9e8;
            text-shadow: 3px 3px 0 #7a6a58;
            box-shadow: 0 12px 0 #7a6a58, 0 15px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.08s linear;
            font-family: 'KaiTi', '华文楷体', serif;
            transform: translateY(-4px);
        }

        .main-button:active {
            box-shadow: 0 6px 0 #7a6a58, 0 10px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(6px);
        }

        /* ================= 选关界面 ================= */
        #select-screen {
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e8e0d3;
            align-items: center;
            justify-content: center;
        }

        #select-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 250, 240, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        .back-btn {
            position: absolute;
            top: 2vh;
            left: 4vw;
            background: rgba(184, 166, 139, 0.95);
            border: none;
            padding: 1.5vh 4vw;
            border-radius: 40px;
            font-size: clamp(14px, 4vw, 20px);
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            z-index: 10;
        }

        .back-btn:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(2px);
        }

        .level-scroll {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 90px 20px 40px 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .level-scroll::-webkit-scrollbar {
            display: none;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 500px;
        }

        .level-btn {
            width: clamp(50px, 15vw, 70px);
            height: clamp(50px, 15vw, 70px);
            border-radius: 18px;
            background: #cdba9f;
            border: none;
            font-size: clamp(20px, 6vw, 28px);
            font-weight: bold;
            color: #3a2f23;
            box-shadow: 0 5px 0 #8f7a63, 0 6px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
        }

        .level-btn:active {
            box-shadow: 0 2px 0 #8f7a63;
            transform: translateY(3px);
        }

        /* ================= 关卡界面 ================= */
        #play-screen {
            padding: 6vh 16px 9vh 16px;   /* 底部留 9vh 给底部栏 */
            display: flex;
            flex-direction: column;
            background: #f3efe6;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d9cdb9;
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 6px rgba(88, 68, 48, 0.2), 0 4px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .btn-restart, .btn-exit {
            background: #b8a68b;
            border: none;
            padding: 2vw 5vw;
            border-radius: 40px;
            font-size: clamp(14px, 4vw, 20px);
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            min-width: 20vw;
        }

        .btn-restart:active, .btn-exit:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(3px);
        }

        .timer {
            font-size: clamp(18px, 6vw, 32px);
            font-weight: bold;
            color: #3a2e24;
            background: #f0e8da;
            padding: 1vw 5vw;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #baa78e, inset 0 4px 8px rgba(0,0,0,0.1);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #d9cdb9;
            font-variant-numeric: tabular-nums;
            min-width: 26vw;
            text-align: center;
            display: inline-block;
        }

        /* ===== 古诗展示：屏幕 1/3 ===== */
        .poem-area {
            flex: 1.2;                    /* 从 1 改成 1.2 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fffcf2;
            border-radius: 28px;
            padding: 1.5vh 1vw;
            margin-bottom: 1.5vw;
            box-shadow: inset 0 0 0 3px #d6c6b2, 0 8px 12px rgba(0, 0, 0, 0.1);
            min-height: 0;
            overflow: hidden;
        }

        .poem-title {
            font-size: clamp(16px, 5vw, 24px);
            font-weight: bold;
            color: #8a6a4a;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #e6d6c0;
            flex-shrink: 0;
        }
        .poem-line {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0px 0.2vw;
            font-size: clamp(13px, 4vw, 20px);
            line-height: 1.2;
            color: #3f3226;
            transition: color 0.3s, text-shadow 0.3s;
            font-weight: 600;
            letter-spacing: 0;
        }

        .poem-char {
            display: inline-block;
            color: #3f3226;
            font-size: clamp(13px, 4vw, 20px);
            min-width: clamp(15px, 4.4vw, 22px);
            text-align: center;
            padding: 0;
            transition: color 0.35s, text-shadow 0.35s;
        }

        .poem-char.lit {
            color: #ad6b3e;
            font-weight: 900;
            text-shadow: 0 0 6px #f7d9a0, 1px 1px 0 #fff3e0;
        }

        .poem-char.punctuation {
            opacity: 0.7;
            min-width: 10px;
        }

        /* 拆字部件区：屏幕 2/3，底部预留按钮空间 */
        .pieces-area {
            flex: 2;
            position: relative;
            background: #e6daca;
            border-radius: 28px;
            padding: 1vw 1vw 8vh 1vw;
            margin-bottom: 0;
            box-shadow: inset 0 0 0 3px #cbb99f, inset 0 6px 12px rgba(90, 70, 50, 0.2);
            overflow: hidden;
            min-height: 0;
        }

        .piece-layer {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);   /* 固定 8 列 */
            grid-auto-rows: 1fr;                      /* 行高自动平分 */
            gap: 0;
            padding: 0;
            border-radius: 18px;
            transition: opacity 0.35s, filter 0.35s;
            overflow: hidden;
        }

        .piece-layer.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        .piece-layer.completed {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        .piece-layer.locked {
            opacity: 0.25;
            z-index: 2;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        .piece {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fcf7ed;
            border-radius: 6px;
            padding: 0;
            box-shadow: 0 2px 0 #a58d73;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: clamp(14px, 4.2vw, 19px);
            color: #3f3226;
            font-weight: 600;
            border: 1px solid #cdba9f;
            margin: 0;
            box-sizing: border-box;
            width: auto;
            height: auto;
        }

        .piece:active {
            box-shadow: 0 1px 0 #a58d73;
            transform: translateY(2px);
        }

        .piece.selected {
            background: #ffd98a;
            border-color: #b8860b;
            box-shadow: 0 3px 0 #a67c00, 0 0 0 3px rgba(200, 150, 50, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .piece .part {
            display: inline-block;
            font-size: clamp(15px, 4.5vw, 20px);
            line-height: 1;
        }

        .fly-char {
            position: fixed;
            font-size: 42px;
            font-weight: bold;
            color: #ad6b3e;
            text-shadow: 0 0 12px #f7d9a0;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 1;
            font-family: 'KaiTi', serif;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 30, 20, 0.5);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #fef9ed;
            padding: 6vw 10vw;
            border-radius: 60px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 5px #dac09c;
            text-align: center;
            border: 2px solid #b8a68b;
        }

        .modal-box h2 {
            font-size: clamp(28px, 8vw, 48px);
            color: #6f523b;
            margin-bottom: 4vh;
            text-shadow: 2px 2px 0 #e6d6c0;
            letter-spacing: 4px;
        }

        .modal-btn {
            background: #b8a68b;
            border: none;
            padding: 2.5vh 8vw;
            font-size: clamp(20px, 6vw, 32px);
            border-radius: 40px;
            color: #2c241c;
            font-weight: bold;
            box-shadow: 0 8px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-3px);
        }

        .modal-btn:active {
            box-shadow: 0 3px 0 #7a6a58;
            transform: translateY(5px);
        }

        .hidden-modal {
            display: none;
        }

        .hint {
            font-size: clamp(12px, 3.2vw, 15px);
            color: #8a7a66;
            text-align: left;
            flex: 1;
            line-height: 1.3;
            padding-right: 8px;
            margin-top: 2vh;              /* 往下移 */
        }

        .action-btn {
            background: #b8a68b;
            border: none;
            padding: 1.2vh 4vw;
            border-radius: 40px;
            font-size: clamp(13px, 3.6vw, 17px);
            font-weight: bold;
            color: #d4a017;              /* 金色文字 */
            text-shadow: 1px 1px 0 #7a6a58;
            box-shadow: 0 4px 0 #7a6a58;
            cursor: pointer;
            font-family: 'KaiTi', serif;
            flex-shrink: 0;
        }

        .action-btn:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(2px);
        }

        .bottom-buttons {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 6px;
            height: 8vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 0 4px;
        }
        .bottom-buttons .action-btn {
            pointer-events: auto;
        }

    </style>
</head>
<body>
<div id="game-container">
    <div id="main-screen" class="screen">
        <button class="main-button" id="startBtn">开始</button>
    </div>

    <div id="select-screen" class="screen hidden">
        <button class="back-btn" id="backToMainBtn">← 返回</button>
        <div class="level-scroll">
            <div class="level-buttons" id="levelButtons"></div>
        </div>
    </div>

    <div id="play-screen" class="screen hidden">
        <div class="top-bar">
            <button class="btn-restart" id="restartBtn">重开</button>
            <div class="timer" id="timerDisplay">0:00</div>
            <button class="btn-exit" id="exitBtn">退出</button>
        </div>
        <div class="poem-area" id="poemArea"></div>
        <div class="pieces-area" id="piecesArea"></div>
        <div class="bottom-buttons">
            <div class="hint">点击部件加入候选池，系统自动匹配能拼出的字</div>
            <button class="action-btn" id="hintBtn">提示</button>
        </div>
    </div>

    <div id="winModal" class="modal-overlay hidden-modal">
        <div class="modal-box">
            <h2>🎉 通关 🎉</h2>
            <button class="modal-btn" id="nextLevelBtn">下一关</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ================= 古诗库：两关岳阳楼 + 4 首古诗 =================
        const POEMS = [
            {
                title: "岳阳楼记·上",
                lines: [
                    "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。",
                    "予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。",
                    "然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？"
                ]
            },
            {
                title: "岳阳楼记·中",
                lines: [
                    "若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐耀，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。",
                    "登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。",
                    "至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。",
                    "而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！"
                ]
            },
            {
                title: "岳阳楼记·下",
                lines: [
                    "登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。",
                    "嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。"
                ]
            },           
            {
                title: "滕王阁序·一",
                lines: [
                    "豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。",
                    "都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。"
                ]
            },
            {
                title: "滕王阁序·二",
                lines: [
                    "腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。",
                    "时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿。临帝子之长洲，得天人之旧馆。",
                    "层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。"
                ]
            },
            {
                title: "滕王阁序·三",
                lines: [
                    "披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰迷津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",
                    "遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。"
                ]
            },
            {
                title: "滕王阁序·四",
                lines: [
                    "睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人；萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？"
                ]
            },
            {
                title: "滕王阁序·五",
                lines: [
                    "嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。",
                    "孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！"
                ]
            }
        ];

        // ================= 汉字拆解表 =================
        const CHAR_DECOMPOSE = {
            // ===== 岳阳楼记 =====
            '庆': ['广', '大'], '历': ['厂', '力'], '四': ['四'], '年': ['丿', '干'],
            '春': ['𡗗', '日'], '滕': ['月', '关', '水'], '子': ['子'], '京': ['亠', '口', '小'],
            '谪': ['讠', '啇'], '守': ['宀', '寸'], '巴': ['巴'], '陵': ['阝', '夌'],
            '郡': ['君', '阝'], '越': ['走', '戉'], '明': ['日', '月'], '政': ['正', '攵'],
            '通': ['辶', '甬'], '人': ['人'], '和': ['禾', '口'], '百': ['一', '白'],
            '废': ['广', '发'], '具': ['具'], '兴': ['兴'], '乃': ['乃'],
            '重': ['千', '里'], '修': ['亻', '夂', '彡'], '岳': ['丘', '山'], '阳': ['阝', '日'],

            // ===== 标点 =====
            '，': ['，'], '。': ['。'], '？': ['？'], '！': ['！'], '：': ['：'],

        function getCharParts(ch) {
            if (CHAR_DECOMPOSE[ch]) return CHAR_DECOMPOSE[ch];
            return [ch];
        }

        // ================= 状态 =================
        let currentLevel = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let currentPoemChars = [];
        let currentLayer = 0;
        let totalLayers = 3;
        let layerUnsolved = [];
        let layerPieceContainers = [];
        let charPieceEls = {};
        let selectedPieces = [];

        // DOM
        const mainScreen = document.getElementById('main-screen');
        const selectScreen = document.getElementById('select-screen');
        const playScreen = document.getElementById('play-screen');
        const levelButtons = document.getElementById('levelButtons');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const exitBtn = document.getElementById('exitBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const poemArea = document.getElementById('poemArea');
        const piecesArea = document.getElementById('piecesArea');
        const winModal = document.getElementById('winModal');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        // ================= 计时器 =================
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function startTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerDisplay.textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
        }

        function showScreen(screen) {
            [mainScreen, selectScreen, playScreen].forEach(s => s.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        // ================= 选关 =================
        function buildLevelButtons() {
            levelButtons.innerHTML = '';
            POEMS.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = idx + 1;
                btn.addEventListener('click', () => {
                    currentLevel = idx;
                    enterLevel(currentLevel);
                });
                levelButtons.appendChild(btn);
            });
        }

        // ================= 进入关卡 =================
        function enterLevel(levelIndex) {
            stopTimer();
            resetTimer();
            winModal.classList.add('hidden-modal');
            showScreen(playScreen);

            const poem = POEMS[levelIndex];
            currentLayer = 0;
            selectedPieces = [];

            currentPoemChars = [];
            poem.lines.forEach((line, lineIdx) => {
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if ('，。？！、；：'.includes(char)) continue;
                    currentPoemChars.push({
                        char: char,
                        lit: false,
                        lineIndex: lineIdx,
                        charIndex: i,
                        globalIndex: currentPoemChars.length
                    });
                }
            });

            charPieceEls = {};
            currentPoemChars.forEach((_, idx) => {
                charPieceEls[idx] = [];
            });

            // 按部件数分层，每层最多 72 个部件（8 列 × 9 行）
            const allIndices = currentPoemChars.map((_, idx) => idx);
            shuffleArray(allIndices);

            // 按部件数分层：每层部件数不超过 72
            layerUnsolved = [[]];
            let currentLayerParts = 0;

            allIndices.forEach(idx => {
                const parts = getCharParts(currentPoemChars[idx].char).length;
                if (currentLayerParts + parts > 72 && layerUnsolved[layerUnsolved.length - 1].length > 0) {
                    layerUnsolved.push([]);
                    currentLayerParts = 0;
                }
                layerUnsolved[layerUnsolved.length - 1].push(idx);
                currentLayerParts += parts;
            });

            layerUnsolved = layerUnsolved.map(arr => new Set(arr));
            totalLayers = layerUnsolved.length;

            renderPoem(poem.lines);
            renderAllLayers(poem.lines);
            updateLayerStates();
            startTimer();
        }

        function renderPoem(lines) {
            poemArea.innerHTML = '';
            const titleDiv = document.createElement('div');
            titleDiv.className = 'poem-title';
            titleDiv.textContent = POEMS[currentLevel].title || '';
            poemArea.appendChild(titleDiv);

            let globalIdx = 0;
            lines.forEach((line) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'poem-line';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if ('，。？！、；：'.includes(char)) {
                        const span = document.createElement('span');
                        span.className = 'poem-char punctuation';
                        span.textContent = char;
                        lineDiv.appendChild(span);
                        continue;
                    }
                    const span = document.createElement('span');
                    span.className = 'poem-char';
                    span.textContent = char;
                    span.dataset.globalIndex = globalIdx;
                    span.id = `poem-char-${globalIdx}`;
                    lineDiv.appendChild(span);
                    globalIdx++;
                }
                poemArea.appendChild(lineDiv);
            });
        }

        function renderAllLayers(lines) {
            piecesArea.innerHTML = '';
            layerPieceContainers = [];

            for (let layer = 0; layer < totalLayers; layer++) {
                const layerDiv = document.createElement('div');
                layerDiv.className = 'piece-layer';
                layerDiv.dataset.layerIndex = layer;

                const indices = Array.from(layerUnsolved[layer]);
                shuffleArray(indices);

                indices.forEach(charIdx => {
                    const charObj = currentPoemChars[charIdx];
                    const ch = charObj.char;
                    const parts = getCharParts(ch);

                    parts.forEach((partStr, partIndex) => {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = 'piece';
                        pieceEl.dataset.char = ch;
                        pieceEl.dataset.charIndex = charIdx;
                        pieceEl.dataset.partIndex = partIndex;
                        pieceEl.dataset.layer = layer;

                        const span = document.createElement('span');
                        span.className = 'part';
                        span.textContent = partStr;
                        pieceEl.appendChild(span);

                        pieceEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handlePartClick(pieceEl, charIdx, layer);
                        });

                        layerDiv.appendChild(pieceEl);
                        charPieceEls[charIdx].push(pieceEl);
                    });
                });

                piecesArea.appendChild(layerDiv);
                layerPieceContainers.push(layerDiv);
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function updateLayerStates() {
            layerPieceContainers.forEach((container, layer) => {
                container.classList.remove('active', 'locked', 'completed');
                if (layer < currentLayer) {
                    container.classList.add('completed');
                } else if (layer === currentLayer) {
                    container.classList.add('active');
                } else {
                    container.classList.add('locked');
                }
            });
        }

        // ================= 点击部件 =================
        function handlePartClick(pieceEl, charIdx, layer) {
            if (layer !== currentLayer) return;
            if (currentPoemChars[charIdx].lit) return;
            if (layerUnsolved[layer].size === 0) return;

            if (pieceEl.classList.contains('selected')) {
                pieceEl.classList.remove('selected');
                const idx = selectedPieces.indexOf(pieceEl);
                if (idx > -1) selectedPieces.splice(idx, 1);
                return;
            }

            pieceEl.classList.add('selected');
            selectedPieces.push(pieceEl);
            tryMatchSelected();
        }

        // ================= 候选池匹配 =================
        function tryMatchSelected() {
            const selectedChars = selectedPieces.map(el => el.querySelector('.part').textContent);

            for (let charIdx of layerUnsolved[currentLayer]) {
                const ch = currentPoemChars[charIdx].char;
                const parts = getCharParts(ch);

                if (parts.length === selectedChars.length &&
                    parts.every(p => selectedChars.includes(p)) &&
                    selectedChars.every(p => parts.includes(p))) {
                    completeChar(charIdx, currentLayer);
                    selectedPieces = [];
                    return;
                }
            }

            if (!canMatchAnyPrefix(selectedChars)) {
                selectedPieces.forEach(el => el.classList.remove('selected'));
                selectedPieces = [];
            }
        }

        function canMatchAnyPrefix(selectedChars) {
            for (let charIdx of layerUnsolved[currentLayer]) {
                const ch = currentPoemChars[charIdx].char;
                const parts = getCharParts(ch);
                if (selectedChars.every(p => parts.includes(p))) {
                    return true;
                }
            }
            return false;
        }

        // ================= 完成一个字 =================
        function completeChar(charIdx, layer) {
            const char = currentPoemChars[charIdx].char;
            const targetSpan = document.getElementById(`poem-char-${charIdx}`);
            if (!targetSpan) return;

            const allPieces = charPieceEls[charIdx] || [];
            if (allPieces.length === 0) return;

            const firstPiece = allPieces[0];
            const pieceRect = firstPiece.getBoundingClientRect();
            const targetRect = targetSpan.getBoundingClientRect();

            const flyEl = document.createElement('div');
            flyEl.className = 'fly-char';
            flyEl.textContent = char;
            flyEl.style.left = pieceRect.left + pieceRect.width / 2 - 20 + 'px';
            flyEl.style.top = pieceRect.top + pieceRect.height / 2 - 20 + 'px';
            document.body.appendChild(flyEl);

            requestAnimationFrame(() => {
                flyEl.style.left = targetRect.left + targetRect.width / 2 - 20 + 'px';
                flyEl.style.top = targetRect.top + targetRect.height / 2 - 20 + 'px';
                flyEl.style.opacity = '0.2';
                flyEl.style.transform = 'scale(0.8)';
            });

            setTimeout(() => {
                flyEl.remove();

                currentPoemChars[charIdx].lit = true;
                layerUnsolved[layer].delete(charIdx);
                if (targetSpan) targetSpan.classList.add('lit');

                allPieces.forEach(el => {
                    const idx = selectedPieces.indexOf(el);
                    if (idx > -1) selectedPieces.splice(idx, 1);
                    el.classList.remove('selected');
                    if (el.parentNode) el.remove();
                });

                selectedPieces = [];

                if (layerUnsolved[layer].size === 0) {
                    if (layer === totalLayers - 1) {
                        stopTimer();
                        winModal.classList.remove('hidden-modal');
                    } else {
                        currentLayer++;
                        updateLayerStates();
                    }
                }
            }, 450);
        }

        // ================= 控制 =================
        function restartLevel() {
            enterLevel(currentLevel);
        }

        function exitToSelect() {
            stopTimer();
            resetTimer();
            winModal.classList.add('hidden-modal');
            showScreen(selectScreen);
        }

        function goToNextLevel() {
            winModal.classList.add('hidden-modal');
            let next = currentLevel + 1;
            if (next >= POEMS.length) next = 0;
            currentLevel = next;
            enterLevel(currentLevel);
        }

        // ================= 初始化 =================
        function init() {
            buildLevelButtons();
            startBtn.addEventListener('click', () => showScreen(selectScreen));
            document.getElementById('backToMainBtn').addEventListener('click', () => {
                showScreen(mainScreen);
            });
            restartBtn.addEventListener('click', restartLevel);
            exitBtn.addEventListener('click', exitToSelect);
            nextLevelBtn.addEventListener('click', goToNextLevel);
            showScreen(mainScreen);
        }

        init();
    })();

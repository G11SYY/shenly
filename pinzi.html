<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古诗拼字 · 三层拼字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'KaiTi', '华文楷体', '宋体', 'Microsoft YaHei', serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;   /* 去掉点击蓝色遮罩 */
            -webkit-touch-callout: none;
        }

                button, .piece, .level-btn, .main-button, .back-btn, .btn-restart, .btn-exit, .modal-btn {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2e3b4e;
            padding: 0;
            margin: 0;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background: #f3efe6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            transition: opacity 0.25s ease;
            background: #f3efe6;
        }

         .piece.selected {
            background: #ffd98a;
            border-color: #b8860b;
            box-shadow: 0 4px 0 #a67c00, 0 0 0 4px rgba(200, 150, 50, 0.5);
            transform: translateY(-3px) scale(1.05);
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* ================= 主界面 ================= */
        #main-screen {
            justify-content: center;
            align-items: center;
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e6dfd1;
        }

        .main-button {
            background: rgba(184, 166, 139, 0.95);
            border: 3px solid #fef9e8;
            border-radius: 80px;
            padding: 24px 64px;
            font-size: 48px;
            font-weight: bold;
            color: #fef9e8;
            text-shadow: 3px 3px 0 #7a6a58;
            box-shadow: 0 12px 0 #7a6a58, 0 15px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 8px;
            cursor: pointer;
            transition: all 0.08s linear;
            font-family: 'KaiTi', '华文楷体', serif;
            transform: translateY(-4px);
        }

        .main-button:active {
            box-shadow: 0 6px 0 #7a6a58, 0 10px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(6px);
        }

        /* ================= 选关界面 ================= */
        #select-screen {
            background: url('bg.jpg') center center / cover no-repeat;
            background-color: #e8e0d3;
            align-items: center;
            justify-content: center;
        }

        /* 半透明遮罩 */
        #select-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 250, 240, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        /* 选关界面里的内容要放在遮罩之上，但返回按钮要绝对定位 */
        #select-screen > .level-buttons {
            position: relative;
            z-index: 1;
        }

        /* 返回按钮 - 左上角（放大） */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 18px;
            background: rgba(184, 166, 139, 0.95);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            z-index: 10;
        }

        .back-btn:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(2px);
        }

        /* 选关滚动容器 */
        .level-scroll {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;   /* iOS 顺滑滚动 */
            padding: 90px 20px 40px 20px;        /* 顶部留出返回按钮的空间 */
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* 隐藏滚动条 */
        .level-scroll::-webkit-scrollbar {
            display: none;
        }

        /* 选关按钮组 */
        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 500px;
        }

        /* 关卡按钮 - 缩小到原来一半 */
        .level-btn {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #cdba9f;
            border: none;
            font-size: 26px;
            font-weight: bold;
            color: #3a2f23;
            box-shadow: 0 5px 0 #8f7a63, 0 6px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
        }

        .level-btn:active {
            box-shadow: 0 2px 0 #8f7a63;
            transform: translateY(3px);
        }

        /* ================= 关卡界面 ================= */
        #play-screen {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            background: #f3efe6;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d9cdb9;
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 6px rgba(88, 68, 48, 0.2), 0 4px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .btn-restart, .btn-exit {
            background: #b8a68b;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            color: #2e241b;
            letter-spacing: 2px;
            box-shadow: 0 5px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-2px);
            min-width: 90px;
        }

        .btn-restart:active, .btn-exit:active {
            box-shadow: 0 2px 0 #7a6a58;
            transform: translateY(3px);
        }

        .timer {
            font-size: 32px;
            font-weight: bold;
            color: #3a2e24;
            background: #f0e8da;
            padding: 4px 26px;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #baa78e, inset 0 4px 8px rgba(0,0,0,0.1);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #d9cdb9;
            font-variant-numeric: tabular-nums;
            min-width: 120px;
            text-align: center;
            display: inline-block;
        }

        /* 古诗展示 - 占屏幕 1/2，不滑动 */
        .poem-area {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #fffcf2;
            border-radius: 28px;
            padding: 4px 3px;
            margin-bottom: 30px;        /* 中间空隙 */
            box-shadow: inset 0 0 0 3px #d6c6b2, 0 8px 12px rgba(0, 0, 0, 0.1);
            min-height: 0;
            overflow: hidden;
        }

        /* 古诗标题 */
        .poem-title {
            font-size: 15px;
            font-weight: bold;
            color: #8a6a4a;
            text-align: center;
            margin-bottom: 1px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #e6d6c0;
            flex-shrink: 0;
        }

        .poem-line {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0px 1px;
            font-size: 14px;
            line-height: 1.2;
            color: #cfc3b0;
            transition: color 0.3s, text-shadow 0.3s;
            font-weight: 600;
            letter-spacing: 0;
            text-shadow: 1px 1px 0 #e0d6c8;
        }

        .poem-char {
            display: inline-block;
            transition: color 0.35s, text-shadow 0.35s;
            color: #cfc3b0;
            font-size: 14px;
            min-width: 15px;
            text-align: center;
            padding: 0;
        }

        .poem-char.lit {
            color: #ad6b3e;
            text-shadow: 0 0 4px #f7d9a0, 1px 1px 0 #fff3e0;
            font-weight: 700;
        }
        /* 拆字部件区 - 占屏幕 1/2，三层叠放 */
        .pieces-area {
            flex: 1.5;
            position: relative;
            background: #e6daca;
            border-radius: 28px;
            padding: 8px;
            box-shadow: inset 0 0 0 3px #cbb99f, inset 0 6px 12px rgba(90, 70, 50, 0.2);
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;   /* 部件从顶部开始 */
        }

        /* 每一层：绝对定位叠在一起 */
        .piece-layer {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            align-content: flex-start;
            gap: 0;                      /* 无空隙 */
            padding: 0;
            border-radius: 18px;
            transition: opacity 0.35s, filter 0.35s;
            overflow: hidden;
        }

        /* 当前层：亮、可点 */
        .piece-layer.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        /* 已完成的层：完全透明 */
        .piece-layer.completed {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* 未解锁的层：暗、不可点 */
        .piece-layer.locked {
            opacity: 0.25;
            z-index: 2;
            pointer-events: none;
            filter: grayscale(0.8);
        }

        /* 部件方格 - 再缩小，无空隙 */
        .piece {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            background: #fcf7ed;
            border-radius: 6px;
            padding: 0;
            box-shadow: 0 2px 0 #a58d73;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: 18px;
            color: #3f3226;
            font-weight: 600;
            border: 1px solid #cdba9f;
            width: 36px;
            height: 36px;
            margin: 0;
            box-sizing: border-box;
        }
        .piece:active {
            box-shadow: 0 1px 0 #a58d73;
            transform: translateY(2px);
        }

        .piece.selected {
            background: #ffd98a;
            border-color: #b8860b;
            box-shadow: 0 3px 0 #a67c00, 0 0 0 3px rgba(200, 150, 50, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .piece .part {
            display: inline-block;
            font-size: 18px;
            line-height: 1;
        }
        /* 飞行动画 */
        .fly-char {
            position: fixed;
            font-size: 42px;
            font-weight: bold;
            color: #ad6b3e;
            text-shadow: 0 0 12px #f7d9a0;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            opacity: 1;
            font-family: 'KaiTi', serif;
        }

        /* 通关弹窗 */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40, 30, 20, 0.5);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #fef9ed;
            padding: 40px 60px;
            border-radius: 60px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 5px #dac09c;
            text-align: center;
            border: 2px solid #b8a68b;
        }

        .modal-box h2 {
            font-size: 48px;
            color: #6f523b;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #e6d6c0;
            letter-spacing: 4px;
        }

        .modal-btn {
            background: #b8a68b;
            border: none;
            padding: 18px 60px;
            font-size: 32px;
            border-radius: 40px;
            color: #2c241c;
            font-weight: bold;
            box-shadow: 0 8px 0 #7a6a58;
            cursor: pointer;
            transition: all 0.08s;
            font-family: 'KaiTi', serif;
            transform: translateY(-3px);
        }

        .modal-btn:active {
            box-shadow: 0 3px 0 #7a6a58;
            transform: translateY(5px);
        }

        .hidden-modal {
            display: none;
        }

        .hint {
            font-size: 13px;
            color: #8a7a66;
            margin-top: 6px;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div id="game-container">
    <!-- 主界面 -->
    <div id="main-screen" class="screen">
        <button class="main-button" id="startBtn">开始</button>
    </div>

    <!-- 选关界面 -->
    <div id="select-screen" class="screen hidden">
        <button class="back-btn" id="backToMainBtn">← 返回</button>
        <div class="level-scroll">
            <div class="level-buttons" id="levelButtons"></div>
        </div>
    </div>

    <!-- 关卡游玩界面 -->
    <div id="play-screen" class="screen hidden">
        <div class="top-bar">
            <button class="btn-restart" id="restartBtn">重开</button>
            <div class="timer" id="timerDisplay">0:00</div>
            <button class="btn-exit" id="exitBtn">退出</button>
        </div>
        <div class="poem-area" id="poemArea"></div>
        <div class="pieces-area" id="piecesArea"></div>
        <div class="hint">点击亮的部件，集齐一个字的所有部件即可拼合</div>
    </div>

    <!-- 通关弹窗 -->
    <div id="winModal" class="modal-overlay hidden-modal">
        <div class="modal-box">
            <h2>🎉 通关 🎉</h2>
            <button class="modal-btn" id="nextLevelBtn">下一关</button>
        </div>
    </div>
</div>

        // ================= 古诗库 =================
        const POEMS = [
            {
                title: "岳阳楼记",

                    "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。",
                    "予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？",
                    "若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐耀，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。",
                    "至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。",
                    "嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？时六年九月十五日。"
                ]

        function getCharParts(ch) {
            if (CHAR_DECOMPOSE[ch]) return CHAR_DECOMPOSE[ch];
            return [ch];
        }

        // ================= 状态 =================
        let currentLevel = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let currentPoemChars = [];
        let currentLayer = 0;
        let totalLayers = 3;
        let layerUnsolved = [];
        let layerPieceContainers = [];
        let charProgress = {};
        let charPieceEls = {};

        // DOM
        const mainScreen = document.getElementById('main-screen');
        const selectScreen = document.getElementById('select-screen');
        const playScreen = document.getElementById('play-screen');
        const levelButtons = document.getElementById('levelButtons');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const exitBtn = document.getElementById('exitBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const poemArea = document.getElementById('poemArea');
        const piecesArea = document.getElementById('piecesArea');
        const winModal = document.getElementById('winModal');
        const nextLevelBtn = document.getElementById('nextLevelBtn');

        // ================= 计时器 =================
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function startTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerDisplay.textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0:00';
        }

        function showScreen(screen) {
            [mainScreen, selectScreen, playScreen].forEach(s => s.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        // ================= 选关 =================
        function buildLevelButtons() {
            levelButtons.innerHTML = '';
            POEMS.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = idx + 1;
                btn.addEventListener('click', () => {
                    currentLevel = idx;
                    enterLevel(currentLevel);
                });
                levelButtons.appendChild(btn);
            });
        }

        // ================= 进入关卡 =================
        function enterLevel(levelIndex) {
            stopTimer();
            resetTimer();
            winModal.classList.add('hidden-modal');
            showScreen(playScreen);

            const poem = POEMS[levelIndex];
            currentLayer = 0;

            // 1. 构建字符信息（跳过标点）
            currentPoemChars = [];
            poem.lines.forEach((line, lineIdx) => {
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    // 跳过标点
                    if ('，。？！、；：'.includes(char)) continue;
                    currentPoemChars.push({
                        char: char,
                        lit: false,
                        lineIndex: lineIdx,
                        charIndex: i,
                        globalIndex: currentPoemChars.length
                    });
                }
            });

            // 2. 初始化进度
            charProgress = {};
            charPieceEls = {};
            currentPoemChars.forEach((_, idx) => {
                charProgress[idx] = 0;
                charPieceEls[idx] = [];
            });

            // 3. 打乱并动态分层（每层最多 60 字，最少 3 层，最多 8 层）
            const allIndices = currentPoemChars.map((_, idx) => idx);
            shuffleArray(allIndices);
            const totalChars = allIndices.length;

            let layerCount = Math.ceil(totalChars / 60);
            if (layerCount < 3) layerCount = 3;
            if (layerCount > 8) layerCount = 8;
            totalLayers = layerCount;

            layerUnsolved = [];
            for (let i = 0; i < layerCount; i++) {
                layerUnsolved[i] = new Set();
            }
            allIndices.forEach((idx, i) => {
                const layer = i % layerCount;
                layerUnsolved[layer].add(idx);
            });

            // 4. 渲染古诗
            renderPoem(poem.lines);

            // 5. 渲染部件
            renderAllLayers(poem.lines);

            // 6. 激活第一层
            updateLayerStates();

            startTimer();
        }

        function renderPoem(lines) {
            poemArea.innerHTML = '';

            // 渲染标题
            const titleDiv = document.createElement('div');
            titleDiv.className = 'poem-title';
            titleDiv.textContent = POEMS[currentLevel].title || '';
            poemArea.appendChild(titleDiv);

            // 渲染诗句（跳过标点，与 currentPoemChars 索引一致）
            let globalIdx = 0;
            lines.forEach((line) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'poem-line';
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    // 跳过标点
                    if ('，。？！、；：'.includes(char)) {
                        // 标点仍然显示，但不作为可拼字，也不占索引
                        const span = document.createElement('span');
                        span.className = 'poem-char punctuation';
                        span.textContent = char;
                        lineDiv.appendChild(span);
                        continue;
                    }
                    const span = document.createElement('span');
                    span.className = 'poem-char';
                    span.textContent = char;
                    span.dataset.globalIndex = globalIdx;
                    span.id = `poem-char-${globalIdx}`;
                    lineDiv.appendChild(span);
                    globalIdx++;
                }
                poemArea.appendChild(lineDiv);
            });
        }

        function findGlobalIndex(lineIdx, charIdx) {
            let count = 0;
            for (let li = 0; li < lineIdx; li++) {
                count += POEMS[currentLevel].lines[li].length;
            }
            return count + charIdx;
        }

        // 渲染三层（无标签，叠放）
        function renderAllLayers(lines) {
            piecesArea.innerHTML = '';
            layerPieceContainers = [];

            for (let layer = 0; layer < totalLayers; layer++) {
                const layerDiv = document.createElement('div');
                layerDiv.className = 'piece-layer';
                layerDiv.dataset.layerIndex = layer;

                const indices = Array.from(layerUnsolved[layer]);
                shuffleArray(indices);

                indices.forEach(charIdx => {
                    const charObj = currentPoemChars[charIdx];
                    const ch = charObj.char;
                    const parts = getCharParts(ch);

                    parts.forEach((partStr, partIndex) => {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = 'piece';
                        pieceEl.dataset.char = ch;
                        pieceEl.dataset.charIndex = charIdx;
                        pieceEl.dataset.partIndex = partIndex;
                        pieceEl.dataset.layer = layer;

                        const span = document.createElement('span');
                        span.className = 'part';
                        span.textContent = partStr;
                        pieceEl.appendChild(span);

                        pieceEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handlePartClick(pieceEl, charIdx, layer);
                        });

                        layerDiv.appendChild(pieceEl);
                        charPieceEls[charIdx].push(pieceEl);
                    });
                });

                piecesArea.appendChild(layerDiv);
                layerPieceContainers.push(layerDiv);
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // 更新三层状态：叠放，只有当前层亮
        function updateLayerStates() {
            layerPieceContainers.forEach((container, layer) => {
                container.classList.remove('active', 'locked', 'completed');
                if (layer < currentLayer) {
                    container.classList.add('completed');
                } else if (layer === currentLayer) {
                    container.classList.add('active');
                } else {
                    container.classList.add('locked');
                }
            });
        }

        // ================= 点击部件 =================
        function handlePartClick(pieceEl, charIdx, layer) {
            if (layer !== currentLayer) return;
            if (currentPoemChars[charIdx].lit) return;

            // 如果已经选中，再点一下取消选中
            if (pieceEl.classList.contains('selected')) {
                pieceEl.classList.remove('selected');
                charProgress[charIdx] = Math.max(0, charProgress[charIdx] - 1);
                return;
            }

            // 选中
            pieceEl.classList.add('selected');
            charProgress[charIdx]++;

            const ch = currentPoemChars[charIdx].char;
            const totalParts = getCharParts(ch).length;

            // 检查是否集齐
            if (charProgress[charIdx] >= totalParts) {
                completeChar(charIdx, layer);
            }
        }
        // ================= 完成一个字 =================
        function completeChar(charIdx, layer) {
            const char = currentPoemChars[charIdx].char;
            const targetSpan = document.getElementById(`poem-char-${charIdx}`);
            if (!targetSpan) return;

            const pieceEls = charPieceEls[charIdx];
            if (!pieceEls || pieceEls.length === 0) return;

            const firstPiece = pieceEls[0];
            const pieceRect = firstPiece.getBoundingClientRect();
            const targetRect = targetSpan.getBoundingClientRect();

            const flyEl = document.createElement('div');
            flyEl.className = 'fly-char';
            flyEl.textContent = char;
            flyEl.style.left = pieceRect.left + pieceRect.width / 2 - 20 + 'px';
            flyEl.style.top = pieceRect.top + pieceRect.height / 2 - 20 + 'px';
            document.body.appendChild(flyEl);

            requestAnimationFrame(() => {
                flyEl.style.left = targetRect.left + targetRect.width / 2 - 20 + 'px';
                flyEl.style.top = targetRect.top + targetRect.height / 2 - 20 + 'px';
                flyEl.style.opacity = '0.2';
                flyEl.style.transform = 'scale(0.8)';
            });

            setTimeout(() => {
                flyEl.remove();

                currentPoemChars[charIdx].lit = true;
                layerUnsolved[layer].delete(charIdx);
                if (targetSpan) targetSpan.classList.add('lit');

                pieceEls.forEach(el => {
                    if (el.parentNode) el.remove();
                });

                // 当前层是否全部拼完
                if (layerUnsolved[layer].size === 0) {
                    if (layer === totalLayers - 1) {
                        stopTimer();
                        winModal.classList.remove('hidden-modal');
                    } else {
                        currentLayer++;
                        updateLayerStates();
                    }
                }
            }, 450);
        }

        // ================= 控制 =================
        function restartLevel() {
            enterLevel(currentLevel);
        }

        function exitToSelect() {
            stopTimer();
            resetTimer();
            winModal.classList.add('hidden-modal');
            showScreen(selectScreen);
        }

        function goToNextLevel() {
            winModal.classList.add('hidden-modal');
            let next = currentLevel + 1;
            if (next >= POEMS.length) next = 0;
            currentLevel = next;
            enterLevel(currentLevel);
        }

        // ================= 初始化 =================
        function init() {
            buildLevelButtons();
            startBtn.addEventListener('click', () => showScreen(selectScreen));
            document.getElementById('backToMainBtn').addEventListener('click', () => {
                showScreen(mainScreen);
            });
            restartBtn.addEventListener('click', restartLevel);
            exitBtn.addEventListener('click', exitToSelect);
            nextLevelBtn.addEventListener('click', goToNextLevel);
            showScreen(mainScreen);
        }

        init();
    })();
